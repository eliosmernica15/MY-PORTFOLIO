<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Genpact Hackathon 2026 — 3rd Place — AI Healthcare Diagnostic Triage">
  <defs>
    <radialGradient id="glow" cx="78%" cy="18%" r="75%">
      <stop offset="0" stop-color="#3b2b12"/>
      <stop offset="0.5" stop-color="#191410"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d67b"/>
      <stop offset="0.45" stop-color="#e8b84b"/>
      <stop offset="0.75" stop-color="#b0782a"/>
      <stop offset="1" stop-color="#f5d67b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 150 H1200 M0 300 H1200 M0 450 H1200 M0 600 H1200"/>
    <path d="M150 0 V750 M300 0 V750 M450 0 V750 M600 0 V750 M750 0 V750 M900 0 V750 M1050 0 V750"/>
  </g>

  <!-- trophy-ish emblem: laurel + number -->
  <g transform="translate(600 225)">
    <circle r="96" fill="#141311" stroke="url(#gold)" stroke-width="3" stroke-dasharray="4 7" opacity="0.95"/>
    <text y="26" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="url(#gold)">3</text>
  </g>

  <text x="600" y="392" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="21" letter-spacing="6" fill="#e8b84b">3RD PLACE — GENPACT HACKATHON 2026</text>
  <text x="600" y="460" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="600" fill="#f5f0e6">AI Healthcare Diagnostic Triage</text>
  <text x="600" y="520" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="17" letter-spacing="3" fill="#b9b3a6">FHIR · STREAMING RECORDS · SUB-SECOND DECISION SUPPORT</text>

  <g transform="translate(600 640)">
    <text x="-330" y="0" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="15" letter-spacing="2" fill="#8a857a">KOSOVO</text>
    <text x="0" y="0" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="15" letter-spacing="2" fill="#8a857a">PYTHON · FASTAPI · REACT · POSTGRES</text>
    <text x="330" y="0" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="15" letter-spacing="2" fill="#8a857a">2026</text>
  </g>
</svg>
