version: 2

updates:
  # npm dependencies. Grouped so related packages bump together and PR
  # volume stays manageable for a solo maintainer.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    groups:
      next:
        patterns:
          - 'next'
          - 'eslint-config-next'
          - '@next/bundle-analyzer'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      toolchain:
        patterns:
          - 'typescript'
          - 'eslint'
          - 'prettier'
          - 'husky'
          - 'lint-staged'
        update-types:
          - minor
          - patch
    # Major bumps that should NOT be taken automatically: reviewed
    # individually, if ever. Next 16 and TypeScript 7 are dedicated
    # migrations, eslint-config-next 16 breaks this setup, and ESLint 9
    # is the supported line for Next 15.
    ignore:
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-config-next'
        update-types: ['version-update:semver-major']
      - dependency-name: '@next/bundle-analyzer'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']

  # GitHub Actions. Keeps checkout/setup-node/osv-scanner etc. current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
